version: "3.8"

services:
  nginx:
    build: ./requirements/nginx
    container_name: inception_nginx
    ports:
      - "443"
    volumes:
      - ./web:/var/www/html
  wordpress:
    build: ./requirements/wordpress
    container_name: inception_wordpress
    volumes:
      - ./web:/var/www/html

  mariadb:
    build: ./requirements/mariadb/.
    container_name: inception_mariadb

networks:
  inception:
    driver: bridge